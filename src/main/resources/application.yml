spring:
  application:
    name: stream

  datasource:
    url: jdbc:mysql://${DB_HOST}/STREAM
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

aws:
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  region: "ap-northeast-2"
  bucket-name: "presigned-url-bucket-teamkim"
